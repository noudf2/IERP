<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Albumy | Inazuma Eleven RP</title>

    <link rel="stylesheet" href="albums.css">
</head>

<body>

    <!-- TŁO -->
    <div class="background"></div>


    <!-- GŁÓWNA ZAWARTOŚĆ -->
    <main class="albums-page">


        <!-- NAGŁÓWEK -->
        <header class="page-header">

            <a href="index.html" class="back-button">
                ← Powrót
            </a>

            <div class="title-box">

                <div class="title-decoration">
                    <span class="title-line"></span>

                    <h1>ALBUMY RP</h1>

                    <span class="title-line"></span>
                </div>

                <p>Historia świata Inazuma Eleven RP</p>

            </div>

        </header>


        <!-- ALBUMY -->
        <section class="albums-container">


            <!-- =========================
                 SEZON 01
            ========================== -->

            <a href="season1.html" class="album-card">

                <div class="album-cover">

                    <img
                        src="images/sezon1.jpg"
                        alt="Okładka Sezonu 01"
                    >

                    <div class="album-overlay">

                        <span class="open-text">
                            OTWÓRZ ALBUM
                        </span>

                    </div>

                </div>


                <div class="album-info">

                    <span class="season-number">
                        SEZON 01
                    </span>

                    <h2>
                        Początek Legendy
                    </h2>

                    <p>
                        Historia pierwszego sezonu IERP
                    </p>

                </div>

            </a>



            <!-- =========================
                 SEZON 02
            ========================== -->

            <div class="album-card disabled">

                <div class="album-cover">

                    <div class="coming-soon">
                        <span>SOON</span>
                    </div>

                </div>


                <div class="album-info">

                    <span class="season-number">
                        SEZON 02
                    </span>

                    <h2>
                        Nowa Era
                    </h2>

                    <p>
                        Drugi sezon RP
                    </p>

                </div>

            </div>



            <!-- =========================
                 SEZON 03
            ========================== -->

            <div class="album-card disabled">

                <div class="album-cover">

                    <div class="coming-soon">
                        <span>SOON</span>
                    </div>

                </div>


                <div class="album-info">

                    <span class="season-number">
                        SEZON 03
                    </span>

                    <h2>
                        Nowe Pokolenie
                    </h2>

                    <p>
                        Trzeci sezon RP
                    </p>

                </div>

            </div>



            <!-- =========================
                 SEZON 04
            ========================== -->

            <div class="album-card disabled">

                <div class="album-cover">

                    <div class="coming-soon">
                        <span>SOON</span>
                    </div>

                </div>


                <div class="album-info">

                    <span class="season-number">
                        SEZON 04
                    </span>

                    <h2>
                        Wkrótce
                    </h2>

                    <p>
                        Przyszły sezon RP
                    </p>

                </div>

            </div>


        </section>


        <!-- STOPKA -->
        <footer class="footer">

            <span>IERP</span>

            <p>
                Inazuma Eleven RP
            </p>

        </footer>


    </main>

</body>
</html>
